name: Verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/scrub.py .
      - run: python3 scripts/install.py --config examples/config.json --dry-run
      - run: python3 -m compileall -q security_portal scripts tests
